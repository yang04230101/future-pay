<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future Pay - 衡川國際股份有限公司</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
    <style>
        :root { --dark: #0B101B; --coral: #EF4C5F; --teal: #78CAD2; --white: #FFFFFF; }
        body { background-color: var(--dark); color: var(--white); font-family: 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC', 'Segoe UI', system-ui, sans-serif; font-size: 16.5px; line-height: 1.75; }
        .navbar { background-color: rgba(11,16,27,0.95) !important; }
        .btn-coral { background-color: var(--coral); color: white; border-radius: 32px; }
        .hero { min-height: 780px; display: flex; align-items: center; padding-top: 100px; background: linear-gradient(180deg, rgba(11,16,27,0.8), rgba(11,16,27,0.95)); }
        .section-title { text-align: center; font-size: 32px; margin-bottom: 50px; }
        .section-title::after { content: ''; display: block; width: 80px; height: 4px; background: var(--teal); margin: 15px auto; }
        footer { background: #070a12; padding: 40px 0; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg fixed-top">
    <div class="container">
        <a class="navbar-brand text-white" href="#">Future Pay</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link text-white" href="#about">關於我們</a>
            <a class="nav-link text-white" href="#features">服務特色</a>
            <a class="nav-link text-white" href="#contact">聯絡我們</a>
        </div>
    </div>
</nav>
<header class="hero">
    <div class="container">
        <h1>Future Pay</h1>
        <h2>安全、迅速、專業的支付解決方案</h2>
        <p class="lead">代理收付・跨境支付・系統整合服務</p>
        <button class="btn btn-coral" data-bs-toggle="modal" data-bs-target="#contactModal">立即諮詢</button>
    </div>
</header>
<section id="about" class="py-5">
    <div class="container">
        <h2 class="section-title">關於我們</h2>
        <p class="lead text-center">衡川國際股份有限公司（Heng Chuan International Co., Ltd.）提供專業支付代理與系統服務。</p>
    </div>
</section>
<section id="features" class="py-5">
    <div class="container text-center">
        <h2 class="section-title">服務特色</h2>
        <p>多元收款、跨境支付、T+3 撥款、費率透明、快速技術支援。</p>
    </div>
</section>
<section id="contact" class="py-5 text-center">
    <div class="container">
        <h2 class="section-title">聯絡我們</h2>
        <h4>衡川國際股份有限公司</h4>
        <p>Heng Chuan International Co., Ltd.</p>
        <p>法人代表：黃家慶</p>
    </div>
</section>
<footer class="text-center">
    <p>Copyright © 2026 Future Pay - All Rights Reserved.</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
